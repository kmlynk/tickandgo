spring.application.name=tickandgo

# Database Configuration
# Take them out when deploying to production and use environment variables instead
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=devuser
spring.datasource.password=devpassword

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/event-ticket-platform